[package]
name = "paychecker"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6", features = ["derive"] }
minify-html = "0.18"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"

[[bin]]
name = "pc"
path = "src/bin/pc.rs"
