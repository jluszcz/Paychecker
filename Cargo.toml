[package]
name = "paychecker"
authors = ["Jacob Luszcz"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", features = ["derive"] }
jluszcz_finance_utils = { git = "https://github.com/jluszcz/finance-utils", features = ["backup", "money", "report", "tui"] }
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
jluszcz_finance_utils = { git = "https://github.com/jluszcz/finance-utils", features = ["test-support"] }

[[bin]]
name = "pc"
path = "src/bin/pc.rs"
